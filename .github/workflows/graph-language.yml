name: Graph language

on:
  pull_request:
    paths:
      - 'crates/ruvector-language/**'
      - 'crates/ruvector-language-native/**'
      - 'crates/ruvector-graph/**'
      - 'crates/ruvector-kge/**'
      - 'crates/ruvector-core/**'
      - 'npm/packages/graph-language/**'
      - 'python/ruvector-language/**'
      - 'docs/adr/ADR-GL-*.md'
      - 'docs/research/graph-language/**'
      - 'scripts/test-graph-language.sh'
      - 'scripts/smoke-graph-language-packages.sh'
      - '.github/workflows/graph-language.yml'
      - 'Cargo.toml'
  push:
    branches: [main]
    paths:
      - 'crates/ruvector-language/**'
      - 'crates/ruvector-language-native/**'
      - 'crates/ruvector-graph/**'
      - 'crates/ruvector-kge/**'
      - 'crates/ruvector-core/**'
      - 'npm/packages/graph-language/**'
      - 'python/ruvector-language/**'
      - 'scripts/test-graph-language.sh'
      - 'scripts/smoke-graph-language-packages.sh'
      - '.github/workflows/graph-language.yml'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Compile, lint and exercise real native adapters and SDKs
        run: bash scripts/test-graph-language.sh
      - name: Install package build tools
        run: python -m pip install setuptools==84.0.0 wheel==0.48.0
      - name: Validate packed npm types and installed Python wheel
        run: bash scripts/smoke-graph-language-packages.sh
